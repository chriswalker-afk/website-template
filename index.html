<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23483f">
  <meta name="description" content="An interactive Maths notebook — a reusable learning website prototype.">
  <title>The Maths Notebook — Interactive Book Prototype</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/book.css">
  <link rel="stylesheet" href="./styles/fluency-levels.css">
  <link rel="stylesheet" href="./styles/math-input.css">
  <link rel="stylesheet" href="./styles/math-notation.css">
  <link rel="stylesheet" href="./styles/working-notebook.css">
  <link rel="stylesheet" href="./styles/math-toolkit.css">
</head>
<body>
  <button type="button" class="skip-link" id="skip-page">Skip to the page</button>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbol-bank" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5C7 4 9.5 4.5 12 6c2.5-1.5 5-2 8-.5v13c-3-1.5-5.5-1-8 .5-2.5-1.5-5-2-8-.5z"/><path d="M12 6v13"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5zM3 13l9 5 9-5M3 17l9 5 9-5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M4 4h6c-1-3 4-3 4 0h6v6c-3-1-3 4 0 4v6h-6c1-3-4-3-4 0H4v-6c3 1 3-4 0-4z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 4.5-1 11-11-3.5-3.5-11 11zM14.5 6.5 18 10"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  </svg>
  <header class="sitebar">
    <div class="sitebar__inner">
      <a class="brand" href="#/" id="brand-link" aria-label="The Maths Notebook: contents">
        <span class="brand__icon"><svg class="icon"><use href="#i-book"></use></svg></span>
        <span class="brand__wordmark"><strong>THE MATHS NOTEBOOK</strong></span>
      </a>
      <div class="sitebar__actions">
        <label class="topic-switcher" for="topic-switcher"><span>PREVIEW TOPIC</span>
          <select id="topic-switcher"></select>
        </label>
        <button type="button" class="motion-toggle" id="motion-toggle" aria-pressed="false" title="Toggle decorative page animations">
          <svg class="icon"><use href="#i-settings"></use></svg><span id="motion-label">Motion: Auto</span>
        </button>
        
      </div>
    </div>
  </header>
  <div class="scene" id="scene">
    <div id="app"></div>
  </div>
  <div id="live-message" role="status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="noscript">This interactive book needs JavaScript to open its chapters. Please enable JavaScript to view the prototype.</div></noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
