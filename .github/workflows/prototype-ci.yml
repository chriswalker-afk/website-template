name: Notebook prototype checks

on:
  pull_request:
  push:
    branches: [main]

# Only the newest run for a PR needs to finish. This avoids overlapping
# 12-minute browser suites as fixes are pushed to the same feature branch.
concurrency:
  group: notebook-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Fast code and worksheet checks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Validate configuration, JavaScript and unit tests
        run: npm run check
      - name: Generate reproducible worksheet LaTeX samples
        run: npm run test:latex
      - name: Attach worksheet LaTeX samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-worksheet-latex
          path: test-artifacts/latex/
          if-no-files-found: ignore

  browser:
    name: Browser checks (shard ${{ matrix.shard }} of 3)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Cache Chromium browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run one third of the complete browser suite
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Attach visual review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-visual-review-shard-${{ matrix.shard }}
          path: visual-review/
          if-no-files-found: ignore
      - name: Attach failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-playwright-failures-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # Preserve the original required check's job id for PR protection rules.
  validate-and-browser:
    name: validate-and-browser
    needs: [validate, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful fast checks and all browser shards
        env:
          FAST_RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$FAST_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
